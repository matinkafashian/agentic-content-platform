<!doctype html>
<html lang="fa" dir="rtl">
  <head><meta charset="utf-8"><title>محصولات</title></head>
  <body>
    <main data-page="products">
      <h1>محصولات</h1>
      <a href="/admin/products/new">افزودن محصول</a>
      {% if products %}
        <ul>
          {% for product in products %}
            <li>
              <a href="/admin/products/{{ product.id }}">{{ product.name }}</a>
              <span>{{ product.price | price_fa }} تومان</span>
              <span>{{ "فعال" if product.active else "غیرفعال" }}</span>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>هنوز محصولی ثبت نشده است.</p>
      {% endif %}
    </main>
  </body>
</html>
